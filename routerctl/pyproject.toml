[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "routerctl"
version = "0.1.0"
description = "Compile per-team YAML routing configs into a Switchyard TOML deployment, and serve them with live, zero-downtime reload."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
routerctl = "routerctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/routerctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
