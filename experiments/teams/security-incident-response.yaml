# Experiment 8: Security incident response triage. Investigation starts on a capable model by
# default (security work has a higher baseline bar than general coding), escalating to the
# frontier model once the transcript shows the investigation is genuinely stuck or the signals
# are conflicting -- not on the first inconclusive log line.
team: security
owner: security-team@example.com

routes:
  - name: security/incident-response
    policy: escalation
    models:
      weak:   { id: gpt-5.6-sol, client: openai }
      strong: { id: gpt-6-astra, client: openai }
    confirmations: 2
    recent_turn_window: 24
