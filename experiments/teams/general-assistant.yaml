# Experiment 12: A general-purpose assistant with no team-specific opinion about its traffic --
# Switchyard's own zero-config "auto" preset. No judge call at all: a signal-driven heuristic
# over the request itself picks the efficient tier unless the conversation's own tool-use signals
# say otherwise. This is the baseline every other, more deliberately-tuned experiment is compared
# against.
team: platform
owner: platform-team@example.com

routes:
  - name: general/assistant
    policy: auto
    models:
      efficient: { id: gpt-5.6-terra, client: openai }
      capable:   { id: gpt-6-astra,   client: openai }
