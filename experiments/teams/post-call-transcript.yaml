# Experiment 2: Post-call transcript analysis for a voice-AI product. Same shape as this repo's
# own teams/voice-ai.yaml (that one is the shipped product example; this is an independent
# experiment run with its own dataset, kept separate so the two don't share results).
team: voice-ai-experiment
owner: voice-ai-team@example.com

routes:
  - name: experiment/post-call-transcript
    policy: intent
    default: analysis
    models:
      extraction:
        id: gpt-5.6-luna
        client: openai
        description: >
          Pulling a structured field straight out of the transcript: a caller's name, a date, an
          order or account number, an amount, or a plain yes/no outcome. No judgment call, the
          answer is either in the transcript verbatim or it isn't.
      analysis:
        id: gpt-5.6-sol
        client: openai
        description: >
          Summarizing the call, judging customer sentiment or satisfaction, flagging a compliance
          or escalation risk, or anything else that takes reading the whole conversation and
          forming a judgment rather than looking up one fact.
