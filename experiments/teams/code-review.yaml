# Experiment 9: Automated code review comments. A style nit or a naming/formatting complaint is
# cheap to judge; a real correctness or concurrency bug needs a model that can actually reason
# about the code's behavior.
team: eng
owner: platform-eng@example.com

routes:
  - name: eng/code-review
    policy: complexity
    models:
      weak:   { id: gpt-5.6-luna, client: openai }
      strong: { id: gpt-5.6-sol,  client: openai }
    base_threshold: 0.5
    threshold_step: 0.1
    # Plain-English criteria (docs/DECISION.md s14): measured in experiments/complexity_eval.py.
    weak_when: "A naming, formatting, style, docstring, import, or lint-level issue."
    strong_when: "The issue involves concurrency, idempotency, caching or consistency across processes, security, money or numeric precision, failure and retry behaviour, or data correctness under load."
