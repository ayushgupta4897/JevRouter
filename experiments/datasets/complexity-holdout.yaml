- id: hrev-01
  domain: code
  text: "Should this Python variable be named `userList` or `user_list`?"
  expected: weak
- id: hrev-02
  domain: code
  text: "This function has a 180-character line. Flag it per PEP 8."
  expected: weak
- id: hrev-03
  domain: code
  text: "Is it fine to leave a commented-out print statement in production code? Flag it."
  expected: weak
- id: hrev-04
  domain: code
  text: "Suggest a clearer name for a function called `doStuff` that sends the welcome email."
  expected: weak
- id: hrev-05
  domain: code
  text: "This file imports `datetime` twice at the top. Flag the duplicate import."
  expected: weak
- id: hrev-06
  domain: code
  text: "Replace this magic number `86400` with a named constant and suggest a name."
  expected: weak
- id: hrev-07
  domain: code
  text: "This payment webhook handler marks an order paid, then enqueues fulfilment, but the webhook can be delivered more than once and out of order with the refund webhook. Review it for correctness and propose a fix."
  expected: strong
- id: hrev-08
  domain: code
  text: "Review this cache: it stores user permissions in a process-local dict with a 10-minute TTL, and permission revocations are written only to the database. We run 12 replicas behind a load balancer. What can go wrong, and how bad is it?"
  expected: strong
- id: hrev-09
  domain: code
  text: "This code computes loan EMIs using floating-point arithmetic and rounds each installment to 2 decimals, then sums installments to show the total repayable. Is the total correct, and what's the right way to handle money here?"
  expected: strong
- id: hrev-10
  domain: code
  text: "Our pagination uses OFFSET/LIMIT over a table where new rows are inserted constantly and rows can be soft-deleted. Users report seeing duplicates and missing items while scrolling. Review the approach and recommend a correct one."
  expected: strong
- id: hrev-11
  domain: code
  text: "This async worker pulls a job, processes it, and deletes it from the queue only after success; on failure it logs and continues. Jobs call an external API that isn't idempotent. Review the failure modes when the worker crashes mid-job or the API times out."
  expected: strong
- id: hrev-12
  domain: code
  text: "This JWT validation checks the signature and expiry but reads the algorithm from the token header and accepts any algorithm the library supports. Is this safe? Explain the attack, if any, and the fix."
  expected: strong

