- id: hsql-07
  domain: sql
  text: "For each dealer, compute the median days-to-sell per car segment over the last two quarters, excluding cars relisted after a price drop (tracked in `listing_events` with event_type 'relist'), and rank dealers within each segment. Postgres has no MEDIAN aggregate."
  expected: strong
- id: hsql-08
  domain: sql
  text: "Write a query that deduplicates `leads` where the same person appears with different phone formats (+91, 0-prefixed, spaces) and keeps the most recently updated record, while preserving any lead that has an associated `inspection` row even if it isn't the newest."
