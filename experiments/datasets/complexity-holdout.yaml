# Held-out set for the complexity-routing fix (docs/DECISION.md section 14). Written BEFORE the new
# rubric was evaluated, so no rubric wording was tuned against these. 48 items, 12 per domain,
# half `weak` (a small, cheap model answers it fully and correctly) and half `strong` (multi-step,
# several interacting constraints, or a plausible-but-wrong answer is likely). `domain` says which
# route evaluates it. The fourth domain (ops/analytics) has no team-written criteria anywhere, so it
# tests the default rubric alone.

# ---------------------------------------------------------------- SQL
- id: hsql-01
  domain: sql
  text: "List all columns from the `products` table where `category = 'electronics'`."
  expected: weak
- id: hsql-02
  domain: sql
  text: "What's the SQL to count distinct `customer_id` values in `orders`?"
  expected: weak
- id: hsql-03
  domain: sql
  text: "Rename the column `fname` to `first_name` in the `employees` table (PostgreSQL)."
  expected: weak
- id: hsql-04
  domain: sql
  text: "Get the 5 most recent rows from `audit_log` ordered by `created_at`."
  expected: weak
- id: hsql-05
  domain: sql
  text: "Sum the `amount` column in `payments` for rows where `status = 'settled'`."
  expected: weak
- id: hsql-06
  domain: sql
