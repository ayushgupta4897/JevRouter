- id: hsql-10
  domain: sql
  text: "Find gaps-and-islands in `vehicle_status_history`: return each continuous period a car was 'available', merging back-to-back rows with the same status, and handle rows whose `valid_to` is NULL (still current)."
  expected: strong
- id: hsql-11
  domain: sql
  text: "Build a funnel query from `events` (view -> test_drive -> offer -> purchase) that counts a user at a stage only if they completed every earlier stage in order within a 30-day window from their first view, reporting stage-to-stage drop-off per acquisition channel."
