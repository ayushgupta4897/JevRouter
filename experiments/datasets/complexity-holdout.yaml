- id: hsql-09
  domain: sql
  text: "Compute a 7-day rolling conversion rate from `visits` to `bookings` per city, where a booking only counts if it happened within 3 days of the visit and a visitor can have multiple visits; avoid double counting a booking across overlapping visits."
