- id: hsql-12
  domain: sql
  text: "Our monthly revenue query double-counts orders that have multiple line items and multiple payments. Rewrite it so revenue is correct when an order can have several items and be paid in several partial payments, some refunded."
  expected: strong

# ---------------------------------------------------------------- finance
- id: hfin-01
  domain: finance
  text: "What is 18% GST on an invoice of Rs 2,50,000?"
  expected: weak
- id: hfin-02
  domain: finance
  text: "If revenue was $3.2M last year and $3.8M this year, what's the year-over-year growth?"
  expected: weak
- id: hfin-03
  domain: finance
  text: "Convert $45,000 to rupees at 83.2 INR per USD."
  expected: weak
- id: hfin-04
  domain: finance
  text: "Our monthly burn is $180,000 and we have $2.7M in the bank. How many months of runway?"
  expected: weak
- id: hfin-05
  domain: finance
  text: "What is the simple interest on Rs 5,00,000 at 9% per year for 3 years?"
  expected: weak
- id: hfin-06
  domain: finance
  text: "Total these expenses: $4,200, $12,750, $980, $6,300."
  expected: weak
- id: hfin-07
  domain: finance
  text: "Model the unit economics of our car-financing product: loan book of Rs 400 Cr at 14% yield, cost of funds 9.5%, 2.8% expected credit loss rising to 4% in a downturn, origination cost of Rs 6,000 per loan with an average ticket of Rs 5 lakh, and prepayment risk. What's the break-even volume, and how sensitive is it to the downturn scenario?"
  expected: strong
- id: hfin-08
  domain: finance
  text: "Explain why our inventory days rose from 38 to 61 while gross margin per car improved, given a shift toward older, higher-margin stock, slower auction liquidation, and a change in how we capitalize refurbishment costs. Which of these actually hurts cash, and by roughly how much on a Rs 900 Cr inventory?"
  expected: strong
- id: hfin-09
  domain: finance
  text: "Should we hedge our USD-denominated debt of $40M given INR has depreciated ~3% a year, a hedge costs about 4.5% annualized, and 30% of our revenue is export-linked? Walk through the natural hedge, the break-even depreciation rate, and what could make the unhedged position blow up."
  expected: strong
- id: hfin-10
  domain: finance
  text: "Build a cohort-level LTV for customers acquired through three channels with different repeat-purchase curves, a 25% contribution margin that differs by channel, and a 12% discount rate; then show whether the paid channel's CAC of Rs 9,000 is justified over a 3-year horizon."
  expected: strong
- id: hfin-11
  domain: finance
  text: "Reconcile why EBITDA margin improved 400 bps while free cash flow went negative, given a shift to extended payment terms for B2B dealers, higher capex on inspection centres, and a one-time GST refund recognized in the prior year."
  expected: strong
- id: hfin-12
  domain: finance
  text: "We're choosing between an 18-month convertible note with a 20% discount and a $120M cap, and a priced round at $100M pre with 1x non-participating preference. Model founder dilution and exit proceeds under $80M, $200M, and $500M exit scenarios."
  expected: strong

