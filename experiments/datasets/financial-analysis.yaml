  text: "Explain why our unit economics might be deteriorating even though revenue and gross margin are both growing, given rising opex-to-revenue ratio, increasing customer acquisition cost, and a shift in mix toward a lower-margin product line -- and quantify the relative contribution of each factor."
  expected: strong
- id: fin-12
  text: "What's the runway in months if we have $3M in the bank and are burning $250,000 per month?"
  expected: weak
- id: fin-13
  text: "Build a scenario analysis for whether to raise a bridge round now at a $40M cap versus waiting 6 months for a priced round, factoring in current burn rate, expected dilution under each path, the probability-weighted impact of missing the current fundraising window, and how investor sentiment typically shifts with a down-round signal."
  expected: strong
