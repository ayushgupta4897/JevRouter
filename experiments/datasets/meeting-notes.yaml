# 18 requests against meeting transcripts, split between structured action-item extraction and
# narrative summarization.
- id: meet-01
  text: "Transcript: Sarah said she'll send the updated deck by Friday. Tom agreed to follow up with legal on the contract by Wednesday. Question: List the action items and owners."
  expected: action_items
