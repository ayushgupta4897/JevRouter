[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jevjudge"
version = "0.1.0"
description = "OpenAI-compatible structured-output judge backed by TypeSafe Jev (System One), for NVIDIA NeMo Switchyard and other LLM routers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4"]

[project.scripts]
jevjudge = "jevjudge.server:main"
jevjudge-mock = "jevjudge.mocks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevjudge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
